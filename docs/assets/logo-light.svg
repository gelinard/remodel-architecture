<svg xmlns="http://www.w3.org/2000/svg" width="380" height="96" viewBox="0 0 380 96" role="img" aria-labelledby="title">
  <title id="title">Remodel Architecture for .NET</title>
  <!-- Mark: modules (blocks) remodeled one at a time on a foundation that stays (the legacy database). -->
